name: Get Citation Data

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar citations
        id: fetch
        continue-on-error: true
        run: python -u google_scholar_crawler/main.py

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/results/ _data/google_scholar.json _publications/
          if git diff --staged --quiet; then
            echo "No citation data changes"
            exit 0
          fi
          git commit -m "Update Google Scholar citation data $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
